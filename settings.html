<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Twitch Overlay: Settings</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <nav class="tabs" role="tablist" aria-label="Settings sections">
    <button class="tab-btn active" type="button" role="tab" aria-selected="true" data-tab="general" data-i18n="ui.tabGeneral"></button>
    <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab="overlay" data-i18n="ui.tabOverlay"></button>
    <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab="widget" data-i18n="ui.tabWidget"></button>
    <div class="language-switch" role="group" aria-label="Language">
      <button type="button" id="language-en" class="language-option" aria-pressed="true">EN</button>
      <button type="button" id="language-ru" class="language-option" aria-pressed="false">RU</button>
    </div>
  </nav>

  <div class="content">
    <section class="tab" id="tab-general">
    <!-- Подключение -->
    <section class="general-group">
      <h3 class="section-title" data-i18n="ui.generalConnection"></h3>
      <label>
        <span data-i18n="ui.channel"></span>
        <input type="text" id="channel" data-i18n-placeholder="ui.channelPlaceholder">
      </label>
      <label class="proxy-switch">
        <span data-i18n="ui.useProxy"></span>
        <input type="checkbox" id="useProxy" role="switch">
        <span class="proxy-switch-track" aria-hidden="true"></span>
      </label>
      <div class="proxy-box hidden" id="proxyBox">
        <div class="row">
          <input type="text" id="proxyHost" data-i18n-placeholder="ui.proxyHost">
          <input type="number" id="proxyPort" data-i18n-placeholder="ui.proxyPort" style="max-width: 90px;">
        </div>
        <div class="row">
          <input type="text" id="proxyUser" data-i18n-placeholder="ui.proxyUser">
          <input type="password" id="proxyPass" data-i18n-placeholder="ui.proxyPass">
        </div>
        <div class="proxy-test-row">
          <button class="secondary" type="button" id="btn-test-proxy" data-i18n="ui.proxyTest"></button>
          <span id="proxy-test-status" class="proxy-test-status" role="status" aria-live="polite"></span>
        </div>
      </div>
    </section>

    <!-- Фильтрация -->
    <section class="general-group">
      <h3 class="section-title" data-i18n="ui.generalFiltering"></h3>
      <label class="checkbox-label">
        <input type="checkbox" id="hideCommands">
        <span data-i18n="ui.hideCommands"></span>
      </label>
      <label>
        <span data-i18n="ui.bots"></span>
        <input type="text" id="ignoredBots">
      </label>
    </section>

    <!-- Запуск -->
    <section class="general-group">
      <h3 class="section-title" data-i18n="ui.generalStartup"></h3>
      <label class="checkbox-label">
        <input type="checkbox" id="autoStart">
        <span data-i18n="ui.autoStart"></span>
      </label>
    </section>

    <!-- Приложение -->
    <section class="general-group">
      <h3 class="section-title" data-i18n="ui.generalApplication"></h3>
      <div class="update-bar">
        <span class="settings-version" id="app-version"></span>
        <span id="update-check-status"></span>
        <button class="accent" id="btn-check-updates" data-i18n="ui.checkUpdates"></button>
      </div>
      <div class="proxy-box">
        <span class="section-title" data-i18n="ui.storageTitle" style="margin-top: 0;"></span>
        <label>
          <span data-i18n="ui.storagePath"></span>
          <div class="row">
            <input type="text" id="configDir" readonly style="font-size: 11px;">
            <button class="accent" id="btn-open-config-dir" data-i18n="ui.storageOpen"></button>
          </div>
        </label>
      </div>
    </section>

    <div class="support-wrap">
      <a class="support-link" id="btn-support" href="#" role="button" data-i18n="ui.supportAuthor" data-i18n-title="ui.supportAuthorTitle"></a>
    </div>

    </section>

    <!-- Оверлей -->
    <section class="tab hidden" id="tab-overlay">
      <div id="overlay-form" style="display: flex; flex-direction: column; gap: 10px;"></div>
      <div class="tab-actions">
        <button class="accent" id="btn-test" data-i18n="ui.test"></button>
        <div class="reset-col">
          <button class="secondary" id="btn-toggle-overlay" data-i18n="ui.btnHideOverlay"></button>
          <button class="secondary" id="btn-reset-overlay" data-i18n="ui.resetTabDefaults"></button>
        </div>
      </div>
    </section>

    <!-- Виджет для OBS -->
    <section class="tab hidden" id="tab-widget">
      <label class="checkbox-label">
        <input type="checkbox" id="widgetEnabled">
        <span data-i18n="ui.widgetEnable"></span>
      </label>

      <label>
        <span data-i18n="ui.widgetPort"></span>
        <input type="number" id="widgetPort" min="1024" max="65535" style="max-width: 120px;">
      </label>

      <label>
        <span data-i18n="ui.widgetLink"></span>
        <div class="row">
          <input type="text" id="widgetLink" readonly>
          <button class="accent" id="btn-copy" data-i18n="ui.copyLink"></button>
        </div>
      </label>

      <div class="widget-status">
        <span class="dot" id="widget-dot"></span>
        <span id="widget-status-text"></span>
      </div>
      <p class="note" data-i18n="ui.widgetHint"></p>

      <hr>
      <div id="widget-form" style="display: flex; flex-direction: column; gap: 10px;"></div>
      <div class="tab-actions">
        <button class="accent" id="btn-widget-test" data-i18n="ui.widgetTest"></button>
        <button class="secondary" id="btn-reset-widget" data-i18n="ui.resetTabDefaults"></button>
      </div>
    </section>
  </div>

  <div class="footer">
    <button class="primary" id="btn-save" data-i18n="ui.save"></button>
    <span id="save-status"></span>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО 1: Внешний вид плашки -->
  <div class="modal-backdrop hidden" id="modal-plate">
    <div class="modal-window">
      <div class="modal-header" data-i18n="ui.plateModalTitle"></div>
      <div class="modal-preview-pinned">
        <div class="modal-preview-wrap">
          <span class="modal-preview-label" data-i18n="ui.previewLabel"></span>
          <div class="modal-preview-stage">
            <div class="mini-preview-plate" data-mini-preview>
              <span class="mini-author-wrap"><span class="mini-badge">★</span><span class="mini-nick" data-mini-nick>TestViewer</span><span class="mini-colon">: </span></span><span class="mini-text" data-i18n="ui.previewSampleText"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <div class="row">
          <label>
            <span data-i18n="ui.bgMode"></span>
            <select id="m_bgMode">
              <option value="solid" data-i18n="ui.bgModeSolid"></option>
              <option value="grad-mono" data-i18n="ui.bgModeMono"></option>
              <option value="grad-dual" data-i18n="ui.bgModeDual"></option>
            </select>
          </label>
          <label>
            <span data-i18n="ui.bg"></span>
            <div class="slider-row" style="height: 32px;">
              <input type="range" id="m_bgOpacity" min="0" max="100" step="5" value="50">
              <span id="m_bgOpacityVal">50%</span>
            </div>
          </label>
        </div>

        <div class="row">
          <label>
            <span data-i18n="ui.bgColor1"></span>
            <input type="color" id="m_bgColor1" value="#000000">
          </label>
          <label id="m_bgColor2Wrap">
            <span data-i18n="ui.bgColor2"></span>
            <input type="color" id="m_bgColor2" value="#251640">
          </label>
          <label id="m_bgMonoModeWrap">
            <span data-i18n="ui.bgMonoMode"></span>
            <select id="m_bgMonoMode">
              <option value="tone" data-i18n="ui.bgMonoTone"></option>
              <option value="fade" data-i18n="ui.bgMonoFade"></option>
            </select>
          </label>
        </div>

        <label id="m_bgDirectionWrap">
          <span data-i18n="ui.bgDirection"></span>
          <select id="m_bgDirection">
            <option value="to right" data-i18n="ui.dirToRight"></option>
            <option value="to left" data-i18n="ui.dirToLeft"></option>
            <option value="to bottom" data-i18n="ui.dirToBottom"></option>
            <option value="to top" data-i18n="ui.dirToTop"></option>
            <option value="45deg" data-i18n="ui.dir45"></option>
            <option value="135deg" data-i18n="ui.dir135"></option>
            <option value="radial" data-i18n="ui.dirRadial"></option>
          </select>
        </label>

        <hr>

        <div class="row">
          <label>
            <span data-i18n="ui.plateShape"></span>
            <select id="m_plateShape">
              <option value="rounded" data-i18n="ui.shapeRounded"></option>
              <option value="strict" data-i18n="ui.shapeStrict"></option>
            </select>
          </label>
          <label>
            <span data-i18n="ui.borderWidth"></span>
            <div class="slider-row" style="height: 32px;">
              <input type="range" id="m_borderWidth" min="0" max="5" step="1" value="0">
              <span id="m_borderWidthVal">0px</span>
            </div>
          </label>
        </div>

        <div class="row">
          <label>
            <span data-i18n="ui.borderEffect"></span>
            <select id="m_borderEffect">
              <option value="static" data-i18n="ui.effectStatic"></option>
              <option value="neon" data-i18n="ui.effectNeon"></option>
              <option value="pulse" data-i18n="ui.effectPulse"></option>
              <option value="rgb" data-i18n="ui.effectRgb"></option>
              <option value="cyber" data-i18n="ui.effectCyber"></option>
              <option value="breathing" data-i18n="ui.effectBreathing"></option>
            </select>
          </label>
          <label>
            <span data-i18n="ui.borderColor"></span>
            <input type="color" id="m_borderColor" value="#9146FF">
          </label>
          <label id="m_borderColor2Wrap" class="hidden">
            <span data-i18n="ui.borderColor2"></span>
            <input type="color" id="m_borderColor2" value="#FFFFFF">
          </label>
        </div>

        <label id="m_borderEffectSpeedWrap">
          <span data-i18n="ui.borderEffectSpeed"></span>
          <div class="slider-row">
            <input type="range" id="m_borderEffectSpeed" min="1" max="10" step="1" value="5">
            <span id="m_borderEffectSpeedVal">5</span>
          </div>
        </label>

        <label class="checkbox-label" id="m_borderEffectSyncWrap" data-i18n-tip="ui.borderEffectSyncTip">
          <input type="checkbox" id="m_borderEffectSync">
          <span data-i18n="ui.borderEffectSync"></span>
        </label>
      </div>
      <div class="modal-footer">
        <button class="secondary" data-modal-reset="plate" data-i18n="ui.modalReset"></button>
        <div class="modal-footer-right">
          <button class="secondary" data-modal-cancel="plate" data-i18n="ui.modalCancel"></button>
          <button class="primary" data-modal-apply="plate" data-i18n="ui.modalSave"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО 2: Типографика и текст -->
  <div class="modal-backdrop hidden" id="modal-text">
    <div class="modal-window">
      <div class="modal-header" data-i18n="ui.textModalTitle"></div>
      <div class="modal-preview-pinned">
        <div class="modal-preview-wrap">
          <span class="modal-preview-label" data-i18n="ui.previewLabel"></span>
          <div class="modal-preview-stage">
            <div class="mini-preview-plate" data-mini-preview>
              <span class="mini-author-wrap"><span class="mini-badge">★</span><span class="mini-nick" data-mini-nick>TestViewer</span><span class="mini-colon">: </span></span><span class="mini-text" data-i18n="ui.previewSampleText"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <label>
          <span data-i18n="ui.textColor"></span>
          <input type="color" id="m_textColor" value="#FFFFFF">
        </label>

        <label>
          <span data-i18n="ui.textOutlineWidth"></span>
          <div class="slider-row">
            <input type="range" id="m_textOutlineWidth" min="0" max="4" step="1" value="2">
            <span id="m_textOutlineWidthVal">2px</span>
          </div>
        </label>

        <label>
          <span data-i18n="ui.textOutlineColor"></span>
          <input type="color" id="m_textOutlineColor" value="#000000">
        </label>
      </div>
      <div class="modal-footer">
        <button class="secondary" data-modal-reset="text" data-i18n="ui.modalReset"></button>
        <div class="modal-footer-right">
          <button class="secondary" data-modal-cancel="text" data-i18n="ui.modalCancel"></button>
          <button class="primary" data-modal-apply="text" data-i18n="ui.modalSave"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО 3: Кастомизация никнеймов -->
  <div class="modal-backdrop hidden" id="modal-nick">
    <div class="modal-window">
      <div class="modal-header" data-i18n="ui.nickModalTitle"></div>
      <div class="modal-preview-pinned">
        <div class="modal-preview-wrap">
          <span class="modal-preview-label" data-i18n="ui.previewLabel"></span>
          <div class="modal-preview-stage">
            <div class="mini-preview-plate" data-mini-preview>
              <span class="mini-author-wrap"><span class="mini-badge">★</span><span class="mini-nick" data-mini-nick>TestViewer</span><span class="mini-colon">: </span></span><span class="mini-text" data-i18n="ui.previewSampleText"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <label class="checkbox-label">
          <input type="checkbox" id="m_customNickEnabled">
          <span data-i18n="ui.customNickEnabled"></span>
        </label>

        <div class="proxy-box" id="m_nickControlsBox">
          <label>
            <span data-i18n="ui.customNickColor"></span>
            <input type="color" id="m_customNickColor" value="#9146FF">
          </label>

          <label>
            <span data-i18n="ui.customNickOutlineWidth"></span>
            <div class="slider-row">
              <input type="range" id="m_customNickOutlineWidth" min="0" max="4" step="1" value="2">
              <span id="m_customNickOutlineWidthVal">2px</span>
            </div>
          </label>

          <label>
            <span data-i18n="ui.customNickOutlineColor"></span>
            <input type="color" id="m_customNickOutlineColor" value="#000000">
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="secondary" data-modal-reset="nick" data-i18n="ui.modalReset"></button>
        <div class="modal-footer-right">
          <button class="secondary" data-modal-cancel="nick" data-i18n="ui.modalCancel"></button>
          <button class="primary" data-modal-apply="nick" data-i18n="ui.modalSave"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО 3b: Картинка плашки -->
  <div class="modal-backdrop hidden" id="modal-image">
    <div class="modal-window">
      <div class="modal-header" data-i18n="ui.imageModalTitle"></div>
      <div class="modal-preview-pinned">
        <div class="modal-preview-wrap">
          <span class="modal-preview-label" data-i18n="ui.previewLabel"></span>
          <div class="modal-preview-stage">
            <div class="mini-preview-plate" data-mini-preview data-card-preview>
              <span class="mini-author-wrap"><span class="mini-badge">★</span><span class="mini-nick" data-mini-nick>TestViewer</span><span class="mini-colon">: </span></span><span class="mini-text" data-i18n="ui.previewSampleText"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <label>
          <span data-i18n="ui.cardImageSource"></span>
          <select id="m_cardImageSource">
            <optgroup id="m_cardImageGroupPatterns" data-i18n-label="ui.cardImageGroupPatterns">
              <option value="none" data-i18n="ui.cardImageSourceNone"></option>
              <option value="hearts-tile" data-i18n="ui.cardImageHeartsTile"></option>
              <option value="clouds" data-i18n="ui.cardImageClouds"></option>
              <option value="stars-shape" data-i18n="ui.cardImageStarsShape"></option>
              <option value="confetti" data-i18n="ui.cardImageConfetti"></option>
            </optgroup>
            <optgroup id="m_cardImageGroupCustom" data-i18n-label="ui.cardImageGroupCustom">
            </optgroup>
          </select>
        </label>

        <label>
          <span data-i18n="ui.cardImageUpload"></span>
          <div class="row">
            <input type="text" id="m_cardImageName" maxlength="40" data-i18n-placeholder="ui.cardImageNamePlaceholder" style="flex: 1;">
            <input type="file" id="m_cardImageFile" accept="image/png,image/jpeg,image/webp" style="flex: 1; font-size: 11px;">
          </div>
        </label>
        <div class="row" id="m_cardImageManageRow" style="display: none;">
          <button type="button" class="secondary" id="m_cardImageRename" data-i18n="ui.cardImageRename" style="flex: 1;"></button>
          <button type="button" class="secondary" id="m_cardImageDelete" data-i18n="ui.cardImageDeleteBtn" style="flex: 1;"></button>
        </div>
        <div class="preset-confirm-bar hidden" id="img-delete-confirm">
          <span class="preset-confirm-text" id="img-delete-text"></span>
          <div class="preset-confirm-actions">
            <button type="button" class="secondary" id="img-delete-cancel" data-i18n="ui.modalCancel"></button>
            <button type="button" class="primary" id="img-delete-ok"></button>
          </div>
        </div>

        <div class="row">
          <label>
            <span data-i18n="ui.cardImageFit"></span>
            <select id="m_cardImageFit">
              <option value="width" data-i18n="ui.cardImageFitWidth"></option>
              <option value="cover" data-i18n="ui.cardImageFitCover"></option>
              <option value="tile" data-i18n="ui.cardImageFitTile"></option>
            </select>
          </label>
          <label>
            <span data-i18n="ui.cardImageOpacity"></span>
            <div class="slider-row" style="height: 32px;">
              <input type="range" id="m_cardImageOpacity" min="0" max="100" step="5" value="60">
              <span id="m_cardImageOpacityVal">60%</span>
            </div>
          </label>
        </div>

        <div class="row">
          <label>
            <span data-i18n="ui.cardImageScale"></span>
            <div class="slider-row" style="height: 32px;">
              <input type="range" id="m_cardImageScale" min="25" max="500" step="5" value="100">
              <span id="m_cardImageScaleVal">100%</span>
            </div>
          </label>
        </div>

        <div class="row">
          <label>
            <span data-i18n="ui.cardImagePosX"></span>
            <div class="slider-row" style="height: 32px;">
              <input type="range" id="m_cardImagePosX" min="0" max="100" step="5" value="50">
              <span id="m_cardImagePosXVal">50%</span>
            </div>
          </label>
          <label>
            <span data-i18n="ui.cardImagePosY"></span>
            <div class="slider-row" style="height: 32px;">
              <input type="range" id="m_cardImagePosY" min="0" max="100" step="5" value="50">
              <span id="m_cardImagePosYVal">50%</span>
            </div>
          </label>
        </div>

        <p class="note" id="m_cardImageScopeNote" data-i18n="ui.cardImageScopeNote"></p>
        <p class="note" id="m_cardImageScopeNoteW" data-i18n="ui.cardImageScopeNoteWidget" style="display:none"></p>
      </div>
      <div class="modal-footer">
        <button class="secondary" data-modal-reset="image" data-i18n="ui.modalReset"></button>
        <div class="modal-footer-right">
          <button class="secondary" data-modal-cancel="image" data-i18n="ui.modalCancel"></button>
          <button class="primary" data-modal-apply="image" data-i18n="ui.modalSave"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО 4: Стили и пресеты -->
  <div class="modal-backdrop hidden" id="modal-styles">
    <div class="modal-window">
      <div class="modal-header" data-i18n="ui.stylesModalTitle"></div>
      <div class="modal-preview-pinned">
        <div class="modal-preview-wrap">
          <span class="modal-preview-label" data-i18n="ui.previewLabel"></span>
          <div class="modal-preview-stage">
            <div class="mini-preview-plate" data-mini-preview>
              <span class="mini-author-wrap"><span class="mini-badge">★</span><span class="mini-nick" data-mini-nick>TestViewer</span><span class="mini-colon">: </span></span><span class="mini-text" data-i18n="ui.previewSampleText"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <label>
          <span data-i18n="ui.stylesSaveLabel"></span>
          <div class="row">
            <input type="text" id="m_presetNameInput" maxlength="40" data-i18n-placeholder="ui.stylesNamePlaceholder">
            <button type="button" class="accent" id="btn-save-custom-preset" data-i18n="ui.btnSavePreset"></button>
          </div>
        </label>
        <div class="preset-confirm-bar hidden" id="preset-overwrite-confirm">
          <span class="preset-confirm-text" id="preset-overwrite-text"></span>
          <div class="preset-confirm-actions">
            <button type="button" class="secondary" id="btn-preset-overwrite-cancel" data-i18n="ui.modalCancel"></button>
            <button type="button" class="primary" id="btn-preset-overwrite-ok" data-i18n="ui.btnOverwritePreset"></button>
          </div>
        </div>

        <hr>

        <span class="section-title" data-i18n="ui.stylesBuiltInLabel"></span>
        <div class="presets-list" id="builtin-presets-list"></div>

        <span class="section-title" data-i18n="ui.stylesCustomLabel"></span>
        <div class="presets-list" id="custom-presets-list"></div>
        <p class="note hidden" id="preset-lock-note" style="color: #ffc247;"></p>
        <div class="preset-confirm-bar hidden" id="preset-delete-confirm">
          <span class="preset-confirm-text" id="preset-delete-text"></span>
          <div class="preset-confirm-actions">
            <button type="button" class="secondary" id="btn-preset-delete-cancel" data-i18n="ui.modalCancel"></button>
            <button type="button" class="primary" id="btn-preset-delete-ok" data-i18n="ui.btnDeletePreset"></button>
          </div>
        </div>
      </div>
      <div class="modal-footer" style="justify-content: flex-end;">
        <div class="modal-footer-right">
          <button class="secondary" data-modal-cancel="styles" data-i18n="ui.modalCancel"></button>
          <button class="primary" data-modal-apply="styles" data-i18n="ui.modalSave"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: Стили для пользователей -->
  <div class="modal-backdrop hidden" id="modal-userstyles">
    <div class="modal-window">
      <div class="modal-header" id="us-title"></div>
      <div class="modal-body">
        <p class="note" data-i18n="ui.userStylesIntro"></p>
        <label>
          <span data-i18n="ui.userStylesNickLabel"></span>
          <input type="text" id="us-nick" maxlength="26" data-i18n-placeholder="ui.userStylesNickPlaceholder">
        </label>
        <label>
          <span data-i18n="ui.userStylesStyleLabel"></span>
          <select id="us-style"></select>
        </label>
        <div class="us-error hidden" id="us-error"></div>
        <div class="row">
          <button type="button" class="accent" id="us-assign" data-i18n="ui.userStylesAssign"></button>
          <button type="button" class="secondary hidden" id="us-cancel-edit" data-i18n="ui.userStylesCancelEdit"></button>
        </div>
        <div class="preset-confirm-bar hidden" id="us-confirm">
          <span class="preset-confirm-text" id="us-confirm-text"></span>
          <div class="preset-confirm-actions">
            <button type="button" class="secondary" id="us-confirm-cancel" data-i18n="ui.modalCancel"></button>
            <button type="button" class="primary" id="us-confirm-ok"></button>
          </div>
        </div>
        <hr>
        <span class="section-title" data-i18n="ui.userStylesListLabel"></span>
        <div class="presets-list" id="us-list"></div>
      </div>
      <div class="modal-footer" style="justify-content: flex-end;">
        <div class="modal-footer-right">
          <button class="primary" data-extra-close="userstyles" data-i18n="ui.modalClose"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: Ротация стилей -->
  <div class="modal-backdrop hidden" id="modal-rotation">
    <div class="modal-window">
      <div class="modal-header" id="rot-title"></div>
      <div class="modal-body">
        <p class="note" data-i18n="ui.rotationIntro"></p>
        <p class="note" id="rot-mention-note"></p>
        <p class="note hidden" id="rot-need-two" data-i18n="ui.rotationNeedTwo"></p>
        <label class="checkbox-label" id="rot-enable-label"><input type="checkbox" id="rot-enable"><span data-i18n="ui.rotationEnable"></span></label>
        <div id="rot-controls">
          <span class="section-title" data-i18n="ui.rotationSource"></span>
          <label class="checkbox-label"><input type="radio" name="rot-source" value="all" id="rot-src-all"><span id="rot-src-all-text"></span></label>
          <label class="checkbox-label" id="rot-src-manual-label"><input type="radio" name="rot-source" value="manual" id="rot-src-manual"><span data-i18n="ui.rotationSourceManual"></span></label>
          <span class="section-title" data-i18n="ui.rotationOrder"></span>
          <div class="rot-seg">
            <button type="button" id="rot-ord-seq" data-i18n="ui.rotationOrderSeq"></button>
            <button type="button" id="rot-ord-random" data-i18n="ui.rotationOrderRandom"></button>
          </div>
          <p class="note hidden" id="rot-two-note" data-i18n="ui.rotationTwoNote"></p>
          <p class="note hidden" id="rot-all-info"></p>
          <div id="rot-manual" class="hidden">
            <div class="rot-sticky">
              <div class="modal-preview-wrap">
                <span class="modal-preview-label" data-i18n="ui.previewLabel"></span>
                <div class="modal-preview-stage">
                  <div class="mini-preview-plate" id="rot-plate">
                    <span class="mini-author-wrap"><span class="mini-badge">★</span><span class="mini-nick" data-mini-nick>TestViewer</span><span class="mini-colon">: </span></span><span class="mini-text" data-i18n="ui.previewSampleText"></span>
                  </div>
                </div>
              </div>
              <span class="section-title" id="rot-queue-title"></span>
              <div class="rot-chips" id="rot-chips"></div>
            </div>
            <p class="us-error" id="rot-manual-warn"></p>
            <div class="rot-scroll" id="rot-list"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <span id="rot-status" class="note"></span>
        <div class="modal-footer-right">
          <button class="secondary" id="rot-cancel" data-i18n="ui.modalCancel"></button>
          <button class="primary" id="rot-save" data-i18n="ui.modalSave"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО 5: Доступно обновление -->
  <div class="modal-backdrop hidden" id="modal-update">
    <div class="modal-window">
      <div class="modal-header" id="update-modal-title"></div>
      <div class="modal-body">
        <span class="section-title" data-i18n="ui.updateNotesLabel"></span>
        <div class="release-notes-box" id="update-modal-notes"></div>
        <div id="update-progress-text" class="hidden"></div>
      </div>
      <div class="modal-footer">
        <button class="secondary" id="btn-skip-version" data-i18n="ui.btnSkipVersion"></button>
        <div class="modal-footer-right">
          <button class="secondary" id="btn-remind-later" data-i18n="ui.btnRemindLater"></button>
          <button class="primary" id="btn-update-now"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="settings/preview.js"></script>
  <script src="settings/presets.js"></script>
  <script src="settings/images.js"></script>
  <script src="settings/settings.js"></script>
</body>
</html>
