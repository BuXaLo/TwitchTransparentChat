<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Twitch Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Montserrat:wght@600;800&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chat.css">

  <style>
    body {
      background: transparent;
      color: #fff;
      font-family: var(--font-family);
      overflow: hidden;
      height: 100vh;
      user-select: none;
      position: relative;
    }

    .hidden { display: none !important; }

    .titlebar {
      height: 28px;
      background: rgba(18, 18, 22, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 11px;
      color: #aaa;
      position: relative;
      z-index: 50;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .status-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      min-width: 0;
      flex-shrink: 100; /* в узком окне первой уступает место строка статуса, потом кнопки */
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #777;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.online { background: #00d26a; box-shadow: 0 0 6px #00d26a; }
    .status-dot.connecting { background: #ffaa00; box-shadow: 0 0 6px #ffaa00; }
    .status-dot.offline { background: #ff4757; }

    .btn-settings {
      -webkit-app-region: no-drag;
      cursor: pointer;
      background: #9146FF;
      border: none;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .btn-settings:hover { background: #7c2cf5; }

    .titlebar-buttons {
      display: flex;
      align-items: stretch; /* обе кнопки одной высоты, даже если символ ⚙ чуть выше обычного текста */
      gap: 6px;
      min-width: 0;
    }
    /* В узком окне сжимается только «Сквозной режим» (с многоточием), «Настройки» остаётся целой */
    #btn-clickthrough {
      flex-shrink: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #hotkey-warn {
      cursor: help;
      color: #ffaa00;
      font-size: 12px;
      flex-shrink: 0;
    }

    .resizer-br {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 14px;
      height: 14px;
      cursor: se-resize;
      background: linear-gradient(135deg, transparent 50%, rgba(255, 255, 255, 0.2) 50%);
      z-index: 100;
    }

    /* Чат занимает окно за вычетом шапки */
    #chat { --chat-height: calc(100vh - 28px); }
  </style>
</head>
<body>
  <div class="titlebar" id="titlebar">
    <div class="status-wrap">
      <div class="status-dot" id="status-dot" data-i18n-title="ui.networkStatus"></div>
      <span id="hotkey-warn" class="hidden">⚠</span>
      <span id="status-text"></span>
    </div>
    <div class="titlebar-buttons">
      <button class="btn-settings" id="btn-clickthrough" data-i18n="ui.clickThrough" data-i18n-title="tray.clickThrough"></button>
      <button class="btn-settings" id="toggle-settings" data-i18n="ui.settings"></button>
    </div>
  </div>

  <div id="chat" class="dir-top layout-inline"></div>
  <div class="resizer-br" id="resizer"></div>

  <script src="chat-view.js"></script>
  <script>
    const chat = document.getElementById('chat');
    const titlebar = document.getElementById('titlebar');
    const resizer = document.getElementById('resizer');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const hotkeyWarn = document.getElementById('hotkey-warn');

    const view = ChatView.create({ chat });

    /* ---------------- Локализация ---------------- */

    let strings = {};
    let statusIsHint = true;

    function tr(key) {
      return strings[key] !== undefined ? strings[key] : key;
    }

    function applyStrings(newStrings, lang) {
      strings = newStrings || {};
      view.setStrings(strings);
      document.documentElement.lang = lang || 'en';

      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = tr(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-title]').forEach((el) => {
        el.title = tr(el.dataset.i18nTitle);
      });

      if (statusIsHint) statusText.textContent = tr('status.hint');
      hotkeyWarn.title = tr('ui.hotkeyBusy');
    }

    /* ---------------- Кнопки шапки ---------------- */

    document.getElementById('toggle-settings').onclick = () => window.api.openSettings();
    document.getElementById('btn-clickthrough').onclick = () => window.api.enableClickThrough();

    /* ---------------- Начальное состояние ---------------- */

    window.api.getOverlayState().then((state) => {
      applyStrings(state.strings, state.language);
      view.applyConfig(state.config);
    });

    /* ---------------- События от главного процесса ---------------- */

    window.api.onNewMessage((msg) => view.addMessage(msg));
    window.api.onMessageRemoved((info) => view.removeMessages(info));

    // Настройки изменились: сохранены или показываются как предпросмотр из окна настроек
    window.api.onConfigApplied((cfg) => view.applyConfig(cfg));
    window.api.onStringsUpdated((data) => applyStrings(data.strings, data.language));

    window.api.onStatusUpdate((status) => {
      if (status.code) statusDot.className = `status-dot ${status.code}`;
      if (status.text) {
        statusIsHint = false;
        statusText.textContent = status.text;
      }
    });

    window.api.onModeChanged((isClickThrough) => {
      titlebar.style.display = isClickThrough ? 'none' : 'flex';
      resizer.style.display = isClickThrough ? 'none' : 'block';
    });

    // Результат регистрации глобального хоткея
    window.api.onHotkeyStatus((info) => {
      hotkeyWarn.classList.toggle('hidden', info.ok);
    });
  </script>
</body>
</html>
